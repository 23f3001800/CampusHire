# ==============================================================================
# CampusHire — Render Blueprint
# ==============================================================================
# Four components, all on free plans:
#   campushire-api    Flask backend (gunicorn)
#   campushire-web    Vue frontend (static site)
#   campushire-db     Postgres
#   campushire-redis  Key Value (Flask-Caching backend)
#
# Deploy: Render Dashboard -> New -> Blueprint -> pick this repo.
# Values marked `sync: false` are not stored in the repo; Render prompts for
# them. The two cross-service URLs cannot be auto-wired because Render
# blueprints cannot prepend a scheme to a `fromService` host value.
#
# FREE TIER BEHAVIOUR
#   * The API sleeps after 15 min idle; the next request takes ~50s to wake it.
#   * Render deletes free Postgres instances 30 days after creation.
#   * No Celery worker here, so the scheduled deadline-reminder and monthly
#     report emails do not run. Everything the user triggers still works.
#   * Uploaded resumes and offer letters live on the container filesystem and
#     are wiped on every deploy and restart. Attach a Render Disk for anything
#     you need to keep.
# ==============================================================================

databases:
  - name: campushire-db
    databaseName: campushire
    user: campushire
    plan: free
    region: Oregon
    postgresMajorVersion: "16"

services:
  # ── Key Value (Redis) — Flask-Caching backend ──────────────────────────────
  - type: keyvalue
    name: campushire-redis
    plan: free
    region: singapore
    ipAllowList: []            # private network only
    maxmemoryPolicy: allkeys-lru

  # ── Flask API ───────────────────────────────────────────────────────────────
  - type: web
    name: campushire-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    # gunicorn and psycopg2-binary are installed here rather than added to
    # requirements.txt, so this blueprint needs no change to that file.
    buildCommand: pip install -r requirements.txt gunicorn psycopg2-binary
    # bootstrap_db is idempotent, so running it every boot is safe. Without it the
    # roles table is empty and both login and registration fail.
    startCommand: python -m scripts.bootstrap_db && gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60 --access-logfile - --error-logfile -
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      # config.py defaults DEBUG to true, so this must be set explicitly or
      # the production site runs with the debug console enabled.
      - key: DEBUG
        value: "false"

      # Generated once and then held stable. Rotating SECRET_KEY invalidates
      # every issued auth token; rotating the salt invalidates every password
      # hash already stored.
      - key: SECRET_KEY
        generateValue: true
      - key: SECURITY_PASSWORD_SALT
        generateValue: true

      - key: DATABASE_URL
        fromDatabase:
          name: campushire-db
          property: connectionString

      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: campushire-redis
          property: connectionString
      - key: CACHE_REDIS_URL
        fromService:
          type: keyvalue
          name: campushire-redis
          property: connectionString

      # Full origin of the static site, scheme included, no trailing slash:
      #   https://campushire-web.onrender.com
      # Set both once Render has assigned the URL on the first deploy.
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false

      # Minimum 12 chars. Creates the admin account on first boot only.
      - key: ADMIN_PASSWORD
        sync: false

      # SMTP. Leave unset to deploy without email; the app still boots.
      - key: MAIL_SERVER
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USE_TLS
        value: "true"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_DEFAULT_SENDER
        value: noreply@campushire.edu

  # ── Vue static site ─────────────────────────────────────────────────────────
  - type: web
    name: campushire-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    # Vue Router uses createWebHistory, so /admin/students is a real request to
    # the static host. Without this rewrite every deep link 404s.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable   # Vite fingerprints these
    envVars:
      - key: NODE_VERSION
        # Vite 7 needs Node 20.19+. On an older default the build fails with
        # "crypto.hash is not a function".
        value: "20.19.5"
      # Full API base, scheme and /api suffix included:
      #   https://campushire-api.onrender.com/api
      # Inlined into the bundle at build time — changing it requires a REBUILD,
      # not just a restart.
      - key: VITE_API_BASE_URL
        sync: false
